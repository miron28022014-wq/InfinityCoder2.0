name: Build InfinityCoder Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Vulkan llama.cpp runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\bin | Out-Null
          $url = "https://github.com/Caerleus/llama.cpp-vulkan-win/releases/latest/download/llama-vulkan-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llama-vulkan.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama-vulkan.zip" "$env:RUNNER_TEMP\llama-vulkan" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama-vulkan" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the Vulkan package." }
          Copy-Item $server.FullName "src-tauri\bin\llama-server-vulkan.exe" -Force
          if (-not (Test-Path "src-tauri\bin\llama-server-vulkan.exe")) { throw "Runtime copy failed." }

      - name: Download Qwen 2.5 Coder Q4_K_M
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\models | Out-Null
          $url = "https://huggingface.co/second-state/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf?download=true"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri\models\qwen-coder.gguf"
          if (-not (Test-Path "src-tauri\models\qwen-coder.gguf")) { throw "Model download failed." }

      - name: Install dependencies
        run: npm install

      - name: Verify Tauri resources
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri\bin\llama-server-vulkan.exe")) { throw "Missing llama-server resource." }
          if (-not (Test-Path "src-tauri\models\qwen-coder.gguf")) { throw "Missing Qwen resource." }

      - name: Generate Tauri icon\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force -Path src-tauri\\icons | Out-Null\n          Add-Type -AssemblyName System.Drawing\n          $bmp = New-Object System.Drawing.Bitmap 256,256\n          $g = [System.Drawing.Graphics]::FromImage($bmp)\n          $g.Clear([System.Drawing.Color]::FromArgb(13,17,23))\n          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)\n          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(88,166,255))\n          $g.DrawString("IC",$font,$brush,35,70)\n          $bmp.Save("$env:RUNNER_TEMP\\icon.png",[System.Drawing.Imaging.ImageFormat]::Png)\n          $g.Dispose(); $bmp.Dispose()\n          npx @tauri-apps/cli icon "$env:RUNNER_TEMP\\icon.png"\n\n      - name: Build Windows installer\n        run: npm run tauri:build\n\n      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error