name: Build InfinityCoder Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Download Vulkan llama.cpp runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null
          $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "InfinityCoder-CI" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "bin-win-vulkan-x64\\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "Official llama.cpp Windows Vulkan x64 asset was not found." }
          Write-Host "Using llama.cpp asset: $($asset.name)"
          Invoke-WebRequest -Headers @{ "User-Agent" = "InfinityCoder-CI" } -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\llama-vulkan.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama-vulkan.zip" "$env:RUNNER_TEMP\llama-vulkan" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama-vulkan" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the Vulkan package." }

          # Copy the complete native runtime next to the server. The executable
          # may depend on ggml/llama runtime DLLs shipped in the same package.
          $runtimeDir = $server.Directory.FullName
          Copy-Item "$runtimeDir\llama-server.exe" "src-tauri\bin\llama-server-vulkan.exe" -Force
          Get-ChildItem $runtimeDir -Filter "*.dll" -File | Copy-Item -Destination "src-tauri\bin" -Force

          if (-not (Test-Path "src-tauri\bin\llama-server-vulkan.exe")) { throw "llama-server copy failed." }
          $dlls = Get-ChildItem "src-tauri\bin" -Filter "*.dll" -File
          if ($dlls.Count -eq 0) { throw "No runtime DLLs were found next to llama-server.exe." }

      - name: Verify source tree and package metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri\\Cargo.toml")) { throw "src-tauri/Cargo.toml is missing." }
          if (-not (Test-Path "src-tauri\\tauri.conf.json")) { throw "src-tauri/tauri.conf.json is missing." }
          if (-not (Test-Path "src\\main.tsx")) { throw "src/main.tsx is missing." }
          npm run build

      - name: Verify bundled llama-server resource
        shell: pwsh
        run: |
          $server = Get-Item "src-tauri\bin\llama-server-vulkan.exe"
          if ($server.Length -lt 1MB) { throw "llama-server file is unexpectedly small." }
          Write-Host "llama-server: $($server.Length) bytes"
          Write-Host "Runtime DLLs: $((Get-ChildItem "src-tauri\bin" -Filter "*.dll").Count)"
          Write-Host "Qwen model will be downloaded by the Windows installer after installation."

      - name: Generate application icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $tmp = Join-Path $env:RUNNER_TEMP "infinitycoder-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(13,17,23))
          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(88,166,255))
          $g.DrawString("IC",$font,$brush,35,70)
          $g.Dispose()
          $bmp.Save($tmp,[System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npx tauri icon "$tmp"

      - name: Build Windows installer
        shell: pwsh
        run: npm run tauri:build

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "NSIS installer was not produced." }
          $exe | ForEach-Object { Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
