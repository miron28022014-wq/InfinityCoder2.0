name: Build InfinityCoder Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  LLAMA_CPP_TAG: v0.4.1
  LLAMA_CPP_ASSET: llama-v0.4.1-bin-win-vulkan-x64.zip

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate project layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "package.json",
            "src\main.tsx",
            "src-tauri\Cargo.toml",
            "src-tauri\tauri.conf.json",
            "src-tauri\src\main.rs",
            "src-tauri\windows\hooks.nsh"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required file is missing: $path"
            }
          }

          $gguf = Get-ChildItem -Path . -Recurse -File -Filter "*.gguf" -ErrorAction SilentlyContinue
          if ($gguf) {
            $names = ($gguf | ForEach-Object FullName) -join ", "
            throw "A GGUF model is present in the source tree. The model is intentionally downloaded by the installer, so do not commit a 4.68 GB GGUF into the repository. Found: $names"
          }

          if (Test-Path "src-tauri\models") {
            Remove-Item "src-tauri\models" -Recurse -Force
          }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build and type-check frontend
        shell: pwsh
        run: npm run build

      - name: Download official llama.cpp Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "llama-vulkan"
          $zip = Join-Path $env:RUNNER_TEMP "llama-vulkan.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_CPP_TAG/$env:LLAMA_CPP_ASSET"

          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $server = Get-ChildItem $dir -Recurse -File -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) {
            throw "llama-server.exe was not found in the official Vulkan x64 release."
          }

          Copy-Item $server.FullName "src-tauri\bin\llama-server-vulkan.exe" -Force
          Get-ChildItem $server.Directory.FullName -Recurse -File -Filter "*.dll" |
            ForEach-Object { Copy-Item $_.FullName "src-tauri\bin" -Force }

          $dlls = @(Get-ChildItem "src-tauri\bin" -File -Filter "*.dll")
          if ($dlls.Count -eq 0) {
            throw "No llama.cpp runtime DLLs were copied."
          }

          & "src-tauri\bin\llama-server-vulkan.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "The downloaded llama-server executable failed its --version check."
          }

      - name: Generate application icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          $tmp = Join-Path $env:RUNNER_TEMP "infinitycoder-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(13,17,23))
          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(88,166,255))
          $g.DrawString("IC",$font,$brush,35,70)
          $g.Dispose()
          $bmp.Save($tmp,[System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npx --no-install tauri icon "$tmp"

      - name: Build Windows NSIS installer
        shell: pwsh
        run: npm run tauri:build

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem "src-tauri\target\release\bundle\nsis" -File -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "NSIS installer was not produced."
          }
          foreach ($file in $files) {
            if ($file.Length -lt 1MB) {
              throw "Installer is unexpectedly small: $($file.FullName)"
            }
            Write-Host "Installer: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"
            Write-Host "SHA256: $((Get-FileHash $file.FullName -Algorithm SHA256).Hash)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
