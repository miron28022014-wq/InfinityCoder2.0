name: Build InfinityCoder Windows

on:
  workflow_dispatch:
  push:
    branches: [main, premium-hardening-2026-10-05]
    tags: ["v*"]

permissions:
  contents: read

env:
  LLAMA_CPP_TAG: b10982

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate project layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "package.json",
            "src\main.tsx",
            "src-tauri\Cargo.toml",
            "src-tauri\tauri.conf.json",
            "src-tauri\src\main.rs",
            "src-tauri\windows\hooks.nsh"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required file is missing: $path"
            }
          }

          $gguf = Get-ChildItem -Path . -Recurse -File -Filter "*.gguf" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "\node_modules\" -and $_.FullName -notmatch "\target\" }

          if ($gguf) {
            $names = ($gguf | ForEach-Object FullName) -join ", "
            throw "A GGUF model is present in the source tree. The 4.68 GB model is downloaded by the installer. Found: $names"
          }

          if (Test-Path "src-tauri\bin") {
            Remove-Item "src-tauri\bin" -Recurse -Force
          }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript and production frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      - name: Download pinned llama.cpp Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetName = "llama-b10982-bin-win-vulkan-x64.zip"
          $downloadUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-win-vulkan-x64.zip"
          $expected = "513e5305d21c71718f8ae2791ef00bf55cd7377b772ef89788a38bd33cf325cd"
          $dir = Join-Path $env:RUNNER_TEMP "llama-vulkan"
          $zip = Join-Path $env:RUNNER_TEMP $assetName

          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null

          Write-Host "Downloading pinned llama.cpp Vulkan runtime: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zip -UseBasicParsing

          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "llama.cpp archive was not downloaded."
          }

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Downloaded archive SHA256: $zipHash"
          if ($zipHash -ne $expected) {
            throw "llama.cpp archive checksum mismatch. Expected $expected, got $zipHash"
          }

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $serverCandidates = @(Get-ChildItem $dir -Recurse -File -Filter "llama-server.exe" | Sort-Object Length -Descending)
          if ($serverCandidates.Count -eq 0) {
            throw "llama-server.exe was not found in the pinned Vulkan x64 release."
          }

          $server = $serverCandidates | Select-Object -First 1
          Copy-Item $server.FullName "src-tauri\bin\llama-server-vulkan.exe" -Force

          $binary = Get-Item "src-tauri\bin\llama-server-vulkan.exe"
          $header = [System.IO.File]::ReadAllBytes($binary.FullName)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw "llama-server-vulkan.exe is not a valid Windows PE executable."
          }

          Get-ChildItem $dir -Recurse -File |
            Where-Object { $_.Extension -in @(".dll", ".exe") } |
            ForEach-Object {
              if ($_.Name -ne "llama-server.exe") {
                Copy-Item $_.FullName "src-tauri\bin\$($_.Name)" -Force
              }
            }

          $dlls = @(Get-ChildItem "src-tauri\bin" -File -Filter "*.dll")
          if ($dlls.Count -eq 0) {
            throw "No llama.cpp runtime DLLs were copied."
          }

          Write-Host "Bundled llama runtime files:"
          Get-ChildItem "src-tauri\bin" -File | Sort-Object Name |
            ForEach-Object { Write-Host ("  {0} bytes  {1}" -f $_.Length, $_.Name) }

          Write-Host "llama-server: $($binary.Length) bytes"
          Write-Host "Runtime DLL count: $($dlls.Count)"

      - name: Generate application icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing

          $tmp = Join-Path $env:RUNNER_TEMP "infinitycoder-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(13,17,23))
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias

          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(88,166,255))
          $g.DrawString("IC",$font,$brush,35,70)

          $g.Dispose()
          $font.Dispose()
          $brush.Dispose()
          $bmp.Save($tmp,[System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          npx --no-install tauri icon "$tmp"

          if (-not (Test-Path "src-tauri\icons\icon.ico" -PathType Leaf)) {
            throw "Tauri icon generation did not create src-tauri\icons\icon.ico"
          }

      - name: Validate Rust backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo check --manifest-path src-tauri\Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run tauri:build

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(Get-ChildItem "src-tauri\target\release\bundle\nsis" -File -Filter "*.exe" -ErrorAction SilentlyContinue)

          if ($files.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($files.Count)."
          }

          foreach ($file in $files) {
            if ($file.Length -lt 1MB) {
              throw "Installer is unexpectedly small: $($file.FullName)"
            }

            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            Write-Host "Installer: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"
            Write-Host "SHA256: $hash"
          }

          if (-not (Test-Path "src-tauri\target\release\InfinityCoder.exe" -PathType Leaf)) {
            throw "The application executable was not produced."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Build-Diagnostics
          path: |
            dist/
            src-tauri/target/release/bundle/nsis/
          if-no-files-found: ignore
          retention-days: 3
