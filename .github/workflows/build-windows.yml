name: Build InfinityCoder Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Download Vulkan llama.cpp runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null
          $url = "https://github.com/Caerleus/llama.cpp-vulkan-win/releases/latest/download/llama-vulkan-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llama-vulkan.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama-vulkan.zip" "$env:RUNNER_TEMP\llama-vulkan" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama-vulkan" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the Vulkan package." }
          Copy-Item $server.FullName "src-tauri\bin\llama-server-vulkan.exe" -Force
          if (-not (Test-Path "src-tauri\bin\llama-server-vulkan.exe")) { throw "llama-server copy failed." }

      - name: Download Qwen 2.5 Coder Q4_K_M
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\models" | Out-Null
          $url = "https://huggingface.co/second-state/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf?download=true"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri\models\qwen-coder.gguf"
          if (-not (Test-Path "src-tauri\models\qwen-coder.gguf")) { throw "Qwen model download failed." }

      - name: Verify bundled resources
        shell: pwsh
        run: |
          $server = Get-Item "src-tauri\bin\llama-server-vulkan.exe"
          $model = Get-Item "src-tauri\models\qwen-coder.gguf"
          if ($server.Length -lt 1MB) { throw "llama-server file is unexpectedly small." }
          if ($model.Length -lt 1GB) { throw "Qwen GGUF is unexpectedly small." }
          Write-Host "llama-server: $($server.Length) bytes"
          Write-Host "Qwen GGUF: $($model.Length) bytes"

      - name: Generate application icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $tmp = Join-Path $env:RUNNER_TEMP "infinitycoder-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(13,17,23))
          $font = New-Object System.Drawing.Font("Arial",72,[System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(88,166,255))
          $g.DrawString("IC",$font,$brush,35,70)
          $g.Dispose()
          $bmp.Save($tmp,[System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npx tauri icon "$tmp"

      - name: Build Windows installer
        shell: pwsh
        run: npm run tauri:build

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "NSIS installer was not produced." }
          $exe | ForEach-Object { Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
